<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Furniselan Stock Search</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #111;
}

/* MAIN CONTAINER */
.container {
  width: 92%;
  max-width: 1180px;
  margin: 10px auto;
  background: #fff;
  min-height: 100vh;
  padding: 25px 32px 55px;
  border-radius: 14px;
  box-shadow: 0 0 18px rgba(0,0,0,0.12);
}

/* LOGO */
.logo {
  text-align: center;
  margin-bottom: 14px;
}

.logo img {
  width: 205px;
  max-width: 60%;
  display: inline-block;
}

/* DESCRIPTION */
.description {
  text-align: center;
  font-size: 18px;
  color: #4d4d4d;
  margin-bottom: 24px;
  line-height: 1.4;
}

/* SEARCH */
.search-box {
  display: flex;
  gap: 14px;
  margin-bottom: 24px;
  width: 100%;
}

.search-box input {
  flex: 1;
  height: 64px;
  border: 1px solid #009f96;
  border-radius: 10px;
  padding: 0 18px;
  font-size: 21px;
  outline: none;
  color: #111;
}

.search-box input:focus {
  border-color: #008f87;
  box-shadow: 0 0 0 2px rgba(0,159,150,0.10);
}

.search-box button {
  width: 135px;
  height: 64px;
  border: none;
  border-radius: 10px;
  background: #009f96;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.search-box button:hover {
  background: #008b83;
}

/* PRODUCT AREA */
.product-area {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 36px;
  align-items: start;
}

/* PRODUCT IMAGE */
.product-image {
  width: 100%;
  max-width: 420px;
  height: 295px;
  object-fit: cover;
  display: block;
  border-radius: 12px;
}

/* DETAILS TABLE */
.info-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 18px;
}

.info-table td {
  border: 1px solid #d8d8d8;
  padding: 14px;
  height: 52px;
  vertical-align: middle;
}

.info-table td:first-child {
  width: 220px;
  font-weight: bold;
  background: #fafafa;
}

/* STOCK TITLE */
.stock-title {
  font-size: 26px;
  font-weight: bold;
  margin: 20px 0 10px;
}

/* STOCK TABLE */
.stock-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 18px;
}

.stock-table td {
  border: 1px solid #d8d8d8;
  padding: 14px;
  height: 52px;
  vertical-align: middle;
}

.stock-table td:first-child {
  width: 220px;
  font-weight: bold;
  background: #fafafa;
}

/* GREEN STOCK NUMBERS */
.stock-number {
  color: #00a63c;
  font-weight: bold;
}

/* EXTRA DETAIL */
.stock-detail {
  color: #333;
  font-weight: normal;
  margin-left: 8px;
}

/* TOTAL STOCK */
.total-row td {
  background: #009f96 !important;
  color: white;
  font-size: 25px;
  font-weight: bold;
  height: 58px;
}

/* ERROR */
.error {
  text-align: center;
  color: #d00000;
  font-size: 18px;
  padding: 20px;
}

/* LOADING */
.loading {
  text-align: center;
  font-size: 18px;
  padding: 20px;
}

/* MOBILE */
@media (max-width: 850px) {

  .container {
    width: 100%;
    margin: 0;
    padding: 18px 15px 30px;
    border-radius: 0;
  }

  .logo img {
    width: 180px;
  }

  .description {
    font-size: 15px;
    margin-bottom: 20px;
  }

  .search-box {
    gap: 8px;
  }

  .search-box input {
    height: 54px;
    font-size: 18px;
  }

  .search-box button {
    width: 105px;
    height: 54px;
    font-size: 16px;
  }

  .product-area {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .product-image {
    width: 100%;
    max-width: 420px;
    height: auto;
    aspect-ratio: 420 / 295;
    margin: auto;
  }

  .info-table,
  .stock-table {
    font-size: 16px;
  }

  .info-table td,
  .stock-table td {
    padding: 11px;
  }

  .info-table td:first-child,
  .stock-table td:first-child {
    width: 38%;
  }

  .stock-title {
    font-size: 22px;
  }

  .total-row td {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <img
      src="https://furniselan.com/wp-content/uploads/2025/01/furniselan-logo.png"
      alt="Furniselan">
  </div>

  <!-- DESCRIPTION -->
  <div class="description">
    Search Furniselan product SKU and check
    Warehouse-9, Mumbai, Bangalore and Factory No-6
    stock availability.
  </div>

  <!-- SEARCH -->
  <div class="search-box">

    <input
      type="text"
      id="skuInput"
      placeholder="Enter SKU"
      value="VAP-2174"
      autocomplete="off">

    <button onclick="searchSKU()">
      Search
    </button>

  </div>

  <!-- RESULT -->
  <div id="result"></div>

</div>


<script>

/* ========================================
   GOOGLE APPS SCRIPT API
======================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbymi4BRA8DeG-7dxGFTBXx1kqI8ydXsokKwqqaXZKGAmK5Z9tDIk7wnOz0nOyWWtf/exec";


/* ========================================
   SEARCH SKU
======================================== */

function searchSKU() {

  const sku =
    document
      .getElementById("skuInput")
      .value
      .trim();

  const result =
    document.getElementById("result");


  if (!sku) {

    result.innerHTML =
      '<div class="error">Please enter SKU.</div>';

    return;
  }


  result.innerHTML =
    '<div class="loading">Searching...</div>';


  const callbackName =
    "furniselanCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        /* SKU NOT FOUND */

        if (!data || !data.found) {

          result.innerHTML =
            '<div class="error">SKU not found.</div>';

          return;
        }


        /* ==================================
           IMAGE
        ================================== */

        const image =
          data.image || "";


        /* ==================================
           SELLING PRICE
        ================================== */

        let sellingPrice =
          data.selling || "";


        if (
          sellingPrice !== "" &&
          !isNaN(Number(sellingPrice))
        ) {

          sellingPrice =
            "₹ " +
            Number(sellingPrice)
              .toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              });
        }


        /* ==================================
           SIZE
        ================================== */

        let sizeParts = [
          data.w,
          data.d,
          data.h
        ].filter(
          v => v !== "" &&
               v !== null &&
               v !== undefined
        );


        const size =
          sizeParts.length
            ? sizeParts.join(" × ") + " inch"
            : "";


        /* ==================================
           STOCK DETAIL
        ================================== */

        function stockWithDetail(stock, detail) {

          let html =
            '<span class="stock-number">' +
            Number(stock || 0) +
            '</span>';


          if (
            detail &&
            String(detail).trim() !== ""
          ) {

            html +=
              '<span class="stock-detail">— ' +
              escapeHTML(
                String(detail).trim()
              ) +
              '</span>';
          }


          return html;
        }


        /* ==================================
           DISPLAY
        ================================== */

        result.innerHTML = `

          <div class="product-area">

            <!-- PRODUCT IMAGE -->

            <div>

              <img
                class="product-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(data.name || "")}"
                onerror="this.style.visibility='hidden';">

            </div>


            <!-- RIGHT SIDE -->

            <div>

              <!-- PRODUCT DETAILS -->

              <table class="info-table">

                <tr>
                  <td>SKU</td>
                  <td>
                    ${escapeHTML(data.sku || "")}
                  </td>
                </tr>


                <tr>
                  <td>Name</td>
                  <td>
                    ${escapeHTML(data.name || "")}
                  </td>
                </tr>


                <tr>
                  <td>Size</td>
                  <td>
                    ${escapeHTML(size)}
                  </td>
                </tr>


                <tr>
                  <td>Color</td>
                  <td>
                    ${escapeHTML(data.color || "")}
                  </td>
                </tr>


                <tr>
                  <td>Material</td>
                  <td>
                    ${escapeHTML(data.material || "")}
                  </td>
                </tr>


                <tr>
                  <td>Selling Price</td>
                  <td>
                    ${escapeHTML(sellingPrice)}
                  </td>
                </tr>

              </table>


              <!-- WAREHOUSE TITLE -->

              <div class="stock-title">
                Warehouse Stock
              </div>


              <!-- STOCK TABLE -->

              <table class="stock-table">

                <!-- WAREHOUSE 9 -->

                <tr>

                  <td>
                    Warehouse-9
                  </td>

                  <td>
                    ${stockWithDetail(
                      data.warehouse9Stock,
                      data.warehouse9Detail
                    )}
                  </td>

                </tr>


                <!-- MUMBAI -->

                <tr>

                  <td>
                    Mumbai
                  </td>

                  <td>
                    <span class="stock-number">
                      ${Number(data.mumbaiStock || 0)}
                    </span>
                  </td>

                </tr>


                <!-- BANGALORE -->

                <tr>

                  <td>
                    Bangalore
                  </td>

                  <td>
                    <span class="stock-number">
                      ${Number(data.bangaloreStock || 0)}
                    </span>
                  </td>

                </tr>


                <!-- FACTORY NO-6 -->

                <tr>

                  <td>
                    Factory No-6
                  </td>

                  <td>
                    ${stockWithDetail(
                      data.factoryStock,
                      data.factoryDetail
                    )}
                  </td>

                </tr>


                <!-- TOTAL -->

                <tr class="total-row">

                  <td>
                    Total Stock
                  </td>

                  <td>
                    ${Number(data.totalStock || 0)}
                  </td>

                </tr>

              </table>

            </div>

          </div>

        `;

      }

      finally {

        delete window[callbackName];

        const oldScript =
          document.getElementById(callbackName);

        if (oldScript) {
          oldScript.remove();
        }

      }

    };


  /* ==================================
     JSONP
  ================================== */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?sku=" +
    encodeURIComponent(sku) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.innerHTML =
        '<div class="error">' +
        'Unable to connect to stock server.' +
        '</div>';

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);

}


/* ========================================
   ENTER KEY
======================================== */

document
  .getElementById("skuInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        searchSKU();
      }

    }
  );


/* ========================================
   HTML SECURITY
======================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {
  return escapeHTML(value);
}


/* ========================================
   LOAD VAP-2174 AUTOMATICALLY
======================================== */

window.addEventListener(
  "load",
  function() {
    searchSKU();
  }
);

</script>

</body>
</html>
