<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Furniselan Stock | Warehouse Stock Search</title>

<meta name="description"
content="Furniselan Stock - Search Furniselan product SKU and check Warehouse-9, Mumbai, Bangalore and Factory No-6 stock availability.">

<meta name="keywords"
content="Furniselan Stock, Furniselan Warehouse Stock, Furniselan SKU Stock, Furniselan Inventory">

<meta name="robots"
content="index, follow">

<link rel="canonical"
      href="https://furniselan.github.io/">


<meta property="og:title"
      content="Furniselan Stock">

<meta property="og:description"
content="Search Furniselan product SKU and check Warehouse-9, Mumbai, Bangalore and Factory No-6 stock.">

<meta property="og:url"
      content="https://furniselan.github.io/">

<meta property="og:type"
      content="website">


<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}


body{

  background:#f5f5f5;

  padding:20px;

}


.container{

  max-width:900px;

  margin:auto;

  background:#fff;

  padding:25px;

  border-radius:12px;

  box-shadow:
    0 0 15px rgba(0,0,0,.15);

}


.logo{

  text-align:center;

  margin:15px 0;

}


.logo img{

  height:90px;

  max-width:100%;

}


.page-description{

  text-align:center;

  color:#666;

  margin-bottom:25px;

  line-height:1.5;

}


.search{

  display:flex;

  gap:10px;

  margin-bottom:25px;

}


.search input{

  flex:1;

  padding:14px;

  font-size:18px;

  border:1px solid #009688;

  border-radius:8px;

  text-transform:uppercase;

  outline:none;

}


.search input:focus{

  border:2px solid #009688;

}


.search button{

  padding:14px 25px;

  font-size:17px;

  background:#009688;

  color:#fff;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-weight:bold;

}


.search button:hover{

  background:#00796b;

}


.search button:disabled{

  opacity:.7;

  cursor:wait;

}


/* =========================
   RESULT
========================= */

#result{

  margin-top:20px;

}


/* =========================
   PRODUCT
========================= */

.product{

  display:flex;

  gap:25px;

  flex-wrap:wrap;

}


.product-image{

  width:280px;

  height:230px;

  object-fit:cover;

  border-radius:10px;

  border:1px solid #ddd;

}


.info{

  flex:1;

  min-width:280px;

}


table{

  width:100%;

  border-collapse:collapse;

  margin-top:10px;

}


td{

  border:1px solid #ddd;

  padding:10px;

  font-size:16px;

}


td:first-child{

  font-weight:bold;

  background:#f7f7f7;

  width:180px;

}


/* =========================
   WAREHOUSE STOCK
========================= */

.stock{

  margin-top:20px;

}


.stock h3{

  margin-bottom:10px;

  font-size:20px;

}


.stock-number{

  color:#00a651;

  font-weight:bold;

}


.stock-zero{

  color:#e00000;

  font-weight:bold;

}


/* =========================
   TOTAL
========================= */

.total td{

  background:#009688;

  color:#fff;

  font-size:20px;

  font-weight:bold;

}


/* =========================
   ERROR
========================= */

.error{

  color:red;

  font-size:22px;

  text-align:center;

  padding:30px;

}


.loading{

  font-size:20px;

  text-align:center;

  padding:30px;

  color:#009688;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  body{

    padding:10px;

  }


  .container{

    padding:15px;

  }


  .search{

    flex-direction:column;

  }


  .search button{

    width:100%;

  }


  .product{

    flex-direction:column;

  }


  .product-image{

    width:100%;

    height:auto;

    max-height:300px;

    object-fit:contain;

  }


  .info{

    min-width:100%;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- LOGO -->

  <div class="logo">

    <img

      src="https://www.furniselan.com/cdn/shop/files/furniselanin.svg?v=1723913440"

      alt="Furniselan">

  </div>


  <!-- DESCRIPTION -->

  <p class="page-description">

    Search Furniselan product SKU and check
    Warehouse-9, Mumbai, Bangalore and Factory No-6
    stock availability.

  </p>


  <!-- SEARCH -->

  <div class="search">

    <input

      type="text"

      id="sku"

      placeholder="Enter SKU"

      autocomplete="off">


    <button

      id="searchButton"

      onclick="searchProduct()">

      Search

    </button>

  </div>


  <!-- RESULT -->

  <div id="result"></div>


</div>


<script>


// ==================================================
// GOOGLE APPS SCRIPT API
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbymi4BRA8DeG-7dxGFTBXx1kqI8ydXsokKwqqaXZKGVAAmK5Z9tDIk7wnOz0nOyWWtf/exec";


// ==================================================
// HTML SECURITY
// ==================================================

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


// ==================================================
// SEARCH PRODUCT
// ==================================================

function searchProduct(){

  const input =
    document.getElementById("sku");


  const result =
    document.getElementById("result");


  const button =
    document.getElementById("searchButton");


  const sku =
    input.value
      .trim()
      .toUpperCase();


  if(!sku){

    alert("Enter SKU");

    input.focus();

    return;

  }


  // Loading
  result.innerHTML =
    "<div class='loading'>Searching...</div>";


  button.disabled = true;

  button.textContent =
    "Searching...";


  // JSONP callback
  const callbackName =
    "furniselanCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  // Cleanup
  const cleanup = () => {

    button.disabled = false;

    button.textContent =
      "Search";


    try{

      delete window[callbackName];

    }

    catch(e){}


    if(script.parentNode){

      script.parentNode
        .removeChild(script);

    }

  };


  // Callback
  window[callbackName] =
    function(data){

      try{

        showResult(data);

      }

      finally{

        cleanup();

      }

    };


  // API URL
  script.src =
    API_URL +
    "?sku=" +
    encodeURIComponent(sku) +
    "&callback=" +
    encodeURIComponent(callbackName);


  // API error
  script.onerror =
    function(){

      result.innerHTML =
        "<div class='error'>" +
        "Unable to connect to server." +
        "</div>";

      cleanup();

    };


  document.body.appendChild(script);

}


// ==================================================
// SHOW RESULT
// ==================================================

function showResult(data){

  const result =
    document.getElementById("result");


  if(!data){

    result.innerHTML =
      "<div class='error'>" +
      "No response from server." +
      "</div>";

    return;

  }


  if(data.error){

    result.innerHTML =
      "<div class='error'>" +
      escapeHtml(data.error) +
      "</div>";

    return;

  }


  if(!data.found){

    result.innerHTML =
      "<div class='error'>" +
      "Product Not Found" +
      "</div>";

    return;

  }


  // ==================================================
  // STOCK VALUES
  // ==================================================

  const warehouse9 =
    Number(data.warehouse9Stock) || 0;


  const mumbai =
    Number(data.mumbaiStock) || 0;


  const bangalore =
    Number(data.bangaloreStock) || 0;


  const factory =
    Number(data.factoryStock) || 0;


  const total =
    Number(data.totalStock) || 0;


  // ==================================================
  // PRODUCT RESULT
  // ==================================================

  result.innerHTML = `

  <div class="product">


    <!-- PRODUCT IMAGE -->

    <div>

      <img

        class="product-image"

        src="${escapeAttribute(data.image)}"

        alt="${escapeAttribute(
          data.name ||
          data.sku ||
          "Furniselan Product"
        )}"

        onerror="
          this.src='https://via.placeholder.com/300x300?text=No+Image'
        ">

    </div>


    <!-- PRODUCT INFORMATION -->

    <div class="info">


      <table>


        <tr>

          <td>
            SKU
          </td>

          <td>
            ${escapeHtml(data.sku)}
          </td>

        </tr>


        <tr>

          <td>
            Name
          </td>

          <td>
            ${escapeHtml(data.name)}
          </td>

        </tr>


        <tr>

          <td>
            Size
          </td>

          <td>

            ${escapeHtml(data.w)}
            ×
            ${escapeHtml(data.d)}
            ×
            ${escapeHtml(data.h)}
            inch

          </td>

        </tr>


        <tr>

          <td>
            Color
          </td>

          <td>
            ${escapeHtml(data.color)}
          </td>

        </tr>


        <tr>

          <td>
            Material
          </td>

          <td>
            ${escapeHtml(data.material)}
          </td>

        </tr>


        <tr>

          <td>
            Selling Price
          </td>

          <td>

            ₹ ${Number(data.selling || 0)
              .toLocaleString(
                "en-IN",
                {
                  minimumFractionDigits:2,
                  maximumFractionDigits:2
                }
              )}

          </td>

        </tr>


      </table>


      <!-- =========================
           WAREHOUSE STOCK
      ========================== -->

      <div class="stock">


        <h3>
          Warehouse Stock
        </h3>


        <table>


          <!-- WAREHOUSE-9 -->

          <tr>

            <td>
              Warehouse-9
            </td>

            <td class="${
              warehouse9 > 0
              ? "stock-number"
              : "stock-zero"
            }">

              ${warehouse9}

            </td>

          </tr>


          <!-- MUMBAI -->

          <tr>

            <td>
              Mumbai
            </td>

            <td class="${
              mumbai > 0
              ? "stock-number"
              : "stock-zero"
            }">

              ${mumbai}

            </td>

          </tr>


          <!-- BANGALORE -->

          <tr>

            <td>
              Bangalore
            </td>

            <td class="${
              bangalore > 0
              ? "stock-number"
              : "stock-zero"
            }">

              ${bangalore}

            </td>

          </tr>


          <!-- FACTORY NO-6 -->

          <tr>

            <td>
              Factory No-6
            </td>

            <td class="${
              factory > 0
              ? "stock-number"
              : "stock-zero"
            }">

              ${factory}

            </td>

          </tr>


          <!-- TOTAL -->

          <tr class="total">

            <td>
              Total Stock
            </td>

            <td>
              ${total}
            </td>

          </tr>


        </table>


      </div>


    </div>


  </div>

  `;

}


// ==================================================
// ENTER KEY SEARCH
// ==================================================

document
  .getElementById("sku")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        searchProduct();

      }

    }
  );

</script>


</body>

</html>
