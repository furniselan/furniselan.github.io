<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Furniselan Stock Search</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f3f3f3;

  color: #111;

}


.container {

  width: 92%;

  max-width: 1050px;

  margin: 0 auto;

  background: white;

  min-height: 100vh;

  padding: 0 28px 28px;

  box-shadow:
    0 0 18px rgba(0,0,0,0.12);

}


.logo {

  text-align: center;

  padding-top: 0;

  margin-bottom: 20px;

}


.logo img {

  width: 180px;

  max-width: 60%;

}


.description {

  text-align: center;

  font-size: 18px;

  color: #555;

  margin-bottom: 30px;

}


.search-box {

  display: flex;

  gap: 12px;

  margin-bottom: 28px;

}


.search-box input {

  flex: 1;

  height: 56px;

  border: 1px solid #009f96;

  border-radius: 10px;

  padding: 0 16px;

  font-size: 20px;

  outline: none;

}


.search-box button {

  width: 120px;

  border: none;

  border-radius: 10px;

  background: #009d94;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

}


.search-box button:hover {

  background: #008b83;

}


.product-area {

  display: grid;

  grid-template-columns: 315px 1fr;

  gap: 30px;

  align-items: start;

}


.product-image {

  width: 315px;

  height: 260px;

  object-fit: cover;

  border-radius: 12px;

  display: block;

}


.info-table {

  width: 100%;

  border-collapse: collapse;

  font-size: 18px;

}


.info-table td {

  border: 1px solid #ddd;

  padding: 12px;

}


.info-table td:first-child {

  width: 205px;

  font-weight: bold;

  background: #fafafa;

}


.stock-title {

  font-size: 24px;

  font-weight: bold;

  margin:

    20px 0 10px;

}


.stock-table {

  width: 100%;

  border-collapse: collapse;

  font-size: 18px;

}


.stock-table td {

  border: 1px solid #ddd;

  padding: 12px;

}


.stock-table td:first-child {

  width: 205px;

  font-weight: bold;

  background: #fafafa;

}


.stock-number {

  color: #00a63c;

  font-weight: bold;

}


.stock-detail {

  color: #333;

  font-weight: normal;

  margin-left: 8px;

}


.total-row td {

  background: #009f96 !important;

  color: white;

  font-size: 23px;

  font-weight: bold;

}


.error {

  text-align: center;

  color: #d00000;

  font-size: 18px;

  padding: 20px;

}


.loading {

  text-align: center;

  font-size: 18px;

  padding: 20px;

}


@media (max-width: 750px) {

  .container {

    width: 100%;

    padding: 0 15px 20px;

  }


  .product-area {

    grid-template-columns: 1fr;

  }


  .product-image {

    width: 100%;

    max-width: 315px;

    margin: auto;

  }


  .search-box {

    gap: 8px;

  }


  .search-box button {

    width: 100px;

  }


  .info-table td:first-child,
  .stock-table td:first-child {

    width: 38%;

  }

}


</style>

</head>


<body>


<div class="container">


  <div class="logo">

    <img
      src="https://furniselan.com/wp-content/uploads/2025/01/furniselan-logo.png"
      alt="Furniselan">

  </div>


  <div class="description">

    Search Furniselan product SKU and check
    Warehouse-9, Mumbai, Bangalore and Factory No-6
    stock availability.

  </div>


  <div class="search-box">

    <input
      type="text"
      id="skuInput"
      placeholder="Enter SKU"
      value="VAP-2174"
      autocomplete="off">

    <button onclick="searchSKU()">
      Search
    </button>

  </div>


  <div id="result"></div>


</div>


<script>


// ========================================
// APPS SCRIPT API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbymi4BRA8DeG-7dxGFTBXx1kqI8ydXsokKwqqaXZKGVAAmK5Z9tDIk7wnOz0nOyWWtf/exec";


// ========================================
// SEARCH
// ========================================

function searchSKU() {

  const sku =
    document
      .getElementById("skuInput")
      .value
      .trim();


  const result =
    document.getElementById("result");


  if (!sku) {

    result.innerHTML =
      '<div class="error">Please enter SKU.</div>';

    return;

  }


  result.innerHTML =
    '<div class="loading">Searching...</div>';


  const callbackName =
    "furniselanCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (!data || !data.found) {

          result.innerHTML =
            '<div class="error">SKU not found.</div>';

          return;

        }


        // ==================================
        // IMAGE
        // ==================================

        const image =
          data.image ||
          "";


        // ==================================
        // SELLING PRICE
        // ==================================

        let sellingPrice =
          data.selling || "";


        if (
          sellingPrice !== "" &&
          !isNaN(Number(sellingPrice))
        ) {

          sellingPrice =
            "₹ " +
            Number(sellingPrice)
              .toLocaleString("en-IN", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              });

        }


        // ==================================
        // SIZE
        // ==================================

        const size =
          [
            data.w,
            data.d,
            data.h
          ]
          .filter(v => v !== "" && v !== null)
          .join(" × ") +
          " inch";


        // ==================================
        // DETAIL FUNCTION
        // ==================================

        function stockWithDetail(
          stock,
          detail
        ) {

          let html =
            '<span class="stock-number">' +
            Number(stock || 0) +
            '</span>';


          if (
            detail &&
            String(detail).trim() !== ""
          ) {

            html +=
              '<span class="stock-detail">— ' +
              escapeHTML(
                String(detail).trim()
              ) +
              '</span>';

          }


          return html;

        }


        // ==================================
        // DISPLAY
        // ==================================

        result.innerHTML = `

          <div class="product-area">

            <div>

              <img
                class="product-image"
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(data.name || "")}">

            </div>


            <div>

              <table class="info-table">

                <tr>
                  <td>SKU</td>
                  <td>${escapeHTML(data.sku || "")}</td>
                </tr>


                <tr>
                  <td>Name</td>
                  <td>${escapeHTML(data.name || "")}</td>
                </tr>


                <tr>
                  <td>Size</td>
                  <td>${escapeHTML(size)}</td>
                </tr>


                <tr>
                  <td>Color</td>
                  <td>${escapeHTML(data.color || "")}</td>
                </tr>


                <tr>
                  <td>Material</td>
                  <td>${escapeHTML(data.material || "")}</td>
                </tr>


                <tr>
                  <td>Selling Price</td>
                  <td>${escapeHTML(sellingPrice)}</td>
                </tr>

              </table>


              <div class="stock-title">
                Warehouse Stock
              </div>


              <table class="stock-table">

                <tr>

                  <td>
                    Warehouse-9
                  </td>

                  <td>
                    ${stockWithDetail(
                      data.warehouse9Stock,
                      data.warehouse9Detail
                    )}
                  </td>

                </tr>


                <tr>

                  <td>
                    Mumbai
                  </td>

                  <td>
                    <span class="stock-number">
                      ${Number(data.mumbaiStock || 0)}
                    </span>
                  </td>

                </tr>


                <tr>

                  <td>
                    Bangalore
                  </td>

                  <td>
                    <span class="stock-number">
                      ${Number(data.bangaloreStock || 0)}
                    </span>
                  </td>

                </tr>


                <tr>

                  <td>
                    Factory No-6
                  </td>

                  <td>
                    ${stockWithDetail(
                      data.factoryStock,
                      data.factoryDetail
                    )}
                  </td>

                </tr>


                <tr class="total-row">

                  <td>
                    Total Stock
                  </td>

                  <td>
                    ${Number(data.totalStock || 0)}
                  </td>

                </tr>

              </table>

            </div>

          </div>

        `;


      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      }

    };


  // ==================================
  // JSONP SCRIPT
  // ==================================

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?sku=" +
    encodeURIComponent(sku) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.innerHTML =
        '<div class="error">Unable to connect to stock server.</div>';

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);

}


// ========================================
// ENTER KEY
// ========================================

document
  .getElementById("skuInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchSKU();

      }

    }
  );


// ========================================
// HTML SECURITY
// ========================================

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


</script>


</body>

</html>
